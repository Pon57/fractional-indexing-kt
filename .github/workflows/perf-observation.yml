name: Performance Observation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  performance-observation:
    name: Initial observation
    uses: ./.github/workflows/perf-measurement.yml
    with:
      measurement: initial

  performance-confirmation:
    name: Confirmation on a fresh runner
    needs: performance-observation
    if: ${{ needs.performance-observation.result == 'success' && needs.performance-observation.outputs.result == 'failed' }}
    uses: ./.github/workflows/perf-measurement.yml
    with:
      measurement: confirmation

  performance-result:
    name: Performance observation result
    needs:
      - performance-observation
      - performance-confirmation
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Evaluate performance result
        env:
          OBSERVATION_JOB_RESULT: ${{ needs.performance-observation.result }}
          PERFORMANCE_RESULT: ${{ needs.performance-observation.outputs.result }}
          CONFIRMATION_JOB_RESULT: ${{ needs.performance-confirmation.result }}
          CONFIRMATION_RESULT: ${{ needs.performance-confirmation.outputs.result }}
        run: |
          set -euo pipefail

          if [ "$OBSERVATION_JOB_RESULT" != "success" ]; then
            echo "::error::The initial performance observation did not complete."
            exit 1
          fi

          case "$PERFORMANCE_RESULT" in
            passed)
              echo "The initial performance observation passed."
              ;;
            failed)
              if [ "$CONFIRMATION_JOB_RESULT" != "success" ] || [ "$CONFIRMATION_RESULT" != "passed" ]; then
                echo "::error::Performance confirmation failed or did not complete on a fresh runner."
                exit 1
              fi
              echo "Performance confirmation passed on a fresh runner."
              ;;
            *)
              echo "::error::The initial performance result is missing or invalid."
              exit 1
              ;;
          esac
