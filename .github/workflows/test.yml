name: Test

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ startsWith(github.head_ref || '', 'tagpr-from-') && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  abi-check:
    name: "checkKotlinAbi"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: zulu
          java-version: 21
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Run ABI compatibility check
        run: ./gradlew :library:checkKotlinAbi --no-configuration-cache

  test:
    name: "${{ matrix.os }} / ${{ matrix.target }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: "jsNodeTest"
          - os: ubuntu-latest
            target: "wasmJsNodeTest"
          - os: ubuntu-latest
            target: "testAndroidHostTest"
          - os: macos-latest
            target: "iosSimulatorArm64Test"
          - os: macos-latest
            target: "macosArm64Test"

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: zulu
          java-version: 21
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Run test target
        run: ./gradlew ${{ matrix.target }} --no-configuration-cache

  jvm-observation:
    name: "JVM tests and performance observation"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      performance_result: ${{ steps.run_perf.outputs.result }}

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: zulu
          java-version: 21
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Run JVM functional tests
        run: ./gradlew jvmTest --no-configuration-cache

      - name: Run JVM performance observation
        id: run_perf
        shell: bash
        run: |
          set -euo pipefail

          if ./gradlew :library:jvmTest \
            -PrunPerformanceTests=true \
            --tests dev.pon.fractionalindexing.FractionalIndexGeneratorPerformanceRegressionTest \
            --rerun \
            --no-configuration-cache
          then
            result="passed"
          else
            result="failed"
            echo "::warning::Performance observation failed; confirming on a fresh runner."
          fi

          echo "result=$result" >> "$GITHUB_OUTPUT"

      - name: Publish JVM performance observation summary
        if: ${{ always() }}
        shell: bash
        env:
          PERF_RESULT: ${{ steps.run_perf.outputs.result }}
        run: |
          profile_line="$(
            grep -Rho -m1 'PERF_PROFILE [^<]*' library/build/test-results/jvmTest 2>/dev/null | head -n1 || true
          )"
          memory_line="$(
            grep -Rho -m1 'PERF_MEMORY [^<]*' library/build/test-results/jvmTest 2>/dev/null | head -n1 || true
          )"
          {
            echo "## JVM Performance Observation"
            echo "- Check result: ${PERF_RESULT:-not completed}"
            echo ""
            if [ -n "$profile_line" ] || [ -n "$memory_line" ]; then
              echo '```text'
              if [ -n "$profile_line" ]; then
                echo "$profile_line"
              fi
              if [ -n "$memory_line" ]; then
                echo "$memory_line"
              fi
              echo '```'
            else
              echo "- No performance measurement was completed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  jvm-performance-confirmation:
    name: "JVM performance confirmation"
    needs: jvm-observation
    if: ${{ needs.jvm-observation.result == 'success' && needs.jvm-observation.outputs.performance_result == 'failed' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: zulu
          java-version: 21
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Confirm JVM performance on a fresh runner
        id: run_perf
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew :library:jvmTest \
            -PrunPerformanceTests=true \
            --tests dev.pon.fractionalindexing.FractionalIndexGeneratorPerformanceRegressionTest \
            --rerun \
            --no-configuration-cache

      - name: Publish JVM performance confirmation summary
        if: ${{ always() }}
        shell: bash
        env:
          PERF_RESULT: ${{ steps.run_perf.outcome }}
        run: |
          profile_line="$(
            grep -Rho -m1 'PERF_PROFILE [^<]*' library/build/test-results/jvmTest 2>/dev/null | head -n1 || true
          )"
          memory_line="$(
            grep -Rho -m1 'PERF_MEMORY [^<]*' library/build/test-results/jvmTest 2>/dev/null | head -n1 || true
          )"
          {
            echo "## JVM Performance Confirmation"
            echo "- Check result: ${PERF_RESULT:-not completed}"
            echo ""
            if [ -n "$profile_line" ] || [ -n "$memory_line" ]; then
              echo '```text'
              if [ -n "$profile_line" ]; then
                echo "$profile_line"
              fi
              if [ -n "$memory_line" ]; then
                echo "$memory_line"
              fi
              echo '```'
            else
              echo "- No performance measurement was completed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Keep this name aligned with the required status check in the main branch ruleset.
  jvm-test:
    name: "ubuntu-latest / jvmTest"
    needs:
      - jvm-observation
      - jvm-performance-confirmation
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Evaluate JVM test result
        shell: bash
        env:
          OBSERVATION_JOB_RESULT: ${{ needs.jvm-observation.result }}
          PERFORMANCE_RESULT: ${{ needs.jvm-observation.outputs.performance_result }}
          CONFIRMATION_JOB_RESULT: ${{ needs.jvm-performance-confirmation.result }}
        run: |
          set -euo pipefail

          if [ "$OBSERVATION_JOB_RESULT" != "success" ]; then
            echo "::error::JVM functional tests or the initial performance observation did not complete."
            exit 1
          fi

          case "$PERFORMANCE_RESULT" in
            passed)
              echo "The initial JVM performance observation passed."
              ;;
            failed)
              if [ "$CONFIRMATION_JOB_RESULT" != "success" ]; then
                echo "::error::JVM performance failed on both independent runners."
                exit 1
              fi
              echo "The JVM performance confirmation passed on a fresh runner."
              ;;
            *)
              echo "::error::The initial JVM performance result is missing or invalid."
              exit 1
              ;;
          esac
