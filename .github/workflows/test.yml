name: Test

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ startsWith(github.head_ref || '', 'tagpr-from-') && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  abi-check:
    name: "checkKotlinAbi"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: zulu
          java-version: 21
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Run ABI compatibility check
        run: ./gradlew :library:checkKotlinAbi --no-configuration-cache

  test:
    name: "${{ matrix.os }} / ${{ matrix.target }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: "jvmTest"
          - os: ubuntu-latest
            target: "jsNodeTest"
          - os: ubuntu-latest
            target: "wasmJsNodeTest"
          - os: ubuntu-latest
            target: "testAndroidHostTest"
          - os: macos-latest
            target: "iosSimulatorArm64Test"
          - os: macos-latest
            target: "macosArm64Test"

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: zulu
          java-version: 21
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Run non-JVM test target
        if: ${{ matrix.target != 'jvmTest' }}
        run: ./gradlew ${{ matrix.target }} --no-configuration-cache

      - name: Run JVM functional tests
        if: ${{ matrix.target == 'jvmTest' }}
        run: ./gradlew jvmTest --no-configuration-cache

      - name: Run JVM performance regression check
        if: ${{ matrix.target == 'jvmTest' }}
        id: run_perf
        shell: bash
        run: |
          set -euo pipefail
          : > jvm-perf-attempts.log

          for attempt in 1 2; do
            if ./gradlew :library:jvmTest \
              -PrunPerformanceTests=true \
              --tests dev.pon.fractionalindexing.FractionalIndexGeneratorPerformanceRegressionTest \
              --rerun \
              --no-configuration-cache
            then
              result="passed"
            else
              result="failed"
            fi

            profile_line="$(
              grep -Rho -m1 'PERF_PROFILE [^<]*' library/build/test-results/jvmTest 2>/dev/null | head -n1 || true
            )"
            memory_line="$(
              grep -Rho -m1 'PERF_MEMORY [^<]*' library/build/test-results/jvmTest 2>/dev/null | head -n1 || true
            )"
            {
              echo "attempt=$attempt result=$result"
              if [ -n "$profile_line" ]; then
                echo "$profile_line"
              fi
              if [ -n "$memory_line" ]; then
                echo "$memory_line"
              fi
            } >> jvm-perf-attempts.log

            if [ "$result" = "passed" ]; then
              echo "attempts=$attempt" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [ "$attempt" -eq 1 ]; then
              echo "::warning::Performance check failed once; confirming with a fresh measurement."
            fi
          done

          echo "attempts=2" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Publish JVM performance profile summary
        if: ${{ always() && matrix.target == 'jvmTest' }}
        shell: bash
        run: |
          {
            echo "## JVM Performance Profile"
            echo "- Check result: ${{ steps.run_perf.outcome }}"
            echo "- Attempts: ${{ steps.run_perf.outputs.attempts || 'not completed' }}"
            echo ""
            if [ -s jvm-perf-attempts.log ]; then
              echo '```text'
              cat jvm-perf-attempts.log
              echo '```'
            else
              echo "- No performance measurement was completed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
