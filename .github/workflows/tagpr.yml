name: tagpr

on:
  push:
    branches: [ "main" ]
  pull_request:
    types: [ "labeled", "unlabeled" ]

jobs:
  tagpr:
    runs-on: ubuntu-26.04
    if: >
      ${{
        github.event_name == 'push'
        || (
          github.event_name == 'pull_request'
          && github.event.sender.type != 'Bot'
          && github.event.action == 'labeled'
          && contains(fromJSON('["major","minor"]'), github.event.label.name)
          && github.event.pull_request.merged == true
        )
        || (
          github.event_name == 'pull_request'
          && github.event.sender.type != 'Bot'
          && contains(fromJSON('["tagpr:major","tagpr:minor"]'), github.event.label.name)
          && startsWith(github.event.pull_request.head.ref, 'tagpr-from-')
        )
      }}
    concurrency:
      group: ${{ github.workflow }}
      cancel-in-progress: true

    steps:
      - name: Generate token
        id: generate_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.TAGPR_APP_ID }}
          private-key: ${{ secrets.TAGPR_PRIVATE_KEY }}

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "main"
          token: ${{ steps.generate_token.outputs.token }}

      # for update lockfiles
      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: 'zulu'
          java-version: 21
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - uses: Songmu/tagpr@047aec4b6c0ce166f52958b5a97f5a3d927fd65b # v1.22.0
        env:
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}
