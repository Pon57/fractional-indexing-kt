name: JVM Performance Measurement

on:
  workflow_call:
    inputs:
      measurement:
        description: Label used to distinguish the initial measurement from its confirmation.
        required: true
        type: string
    outputs:
      result:
        description: Whether the completed performance measurement passed or failed.
        value: ${{ jobs.measurement.outputs.result }}

jobs:
  measurement:
    name: JVM performance ${{ inputs.measurement }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      result: ${{ steps.run_perf.outputs.result }}

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: 21
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Run JVM performance regression test with memory observation
        id: run_perf
        shell: bash
        env:
          MEASUREMENT: ${{ inputs.measurement }}
        run: |
          set -euo pipefail

          if ./gradlew :library:jvmTest \
            -PrunPerformanceTests=true \
            --tests dev.pon.fractionalindexing.FractionalIndexGeneratorPerformanceRegressionTest \
            --rerun \
            --no-configuration-cache 2>&1 | tee perf-observation.log
          then
            result="passed"
          else
            result="failed"
          fi

          profile_line="$(
            grep -Rho -m1 'PERF_PROFILE [^<]*' library/build/test-results/jvmTest 2>/dev/null | head -n1 || true
          )"
          memory_line="$(
            grep -Rho -m1 'PERF_MEMORY [^<]*' library/build/test-results/jvmTest 2>/dev/null | head -n1 || true
          )"
          {
            echo "measurement=$MEASUREMENT result=$result"
            if [ -n "$profile_line" ]; then
              echo "$profile_line"
            fi
            if [ -n "$memory_line" ]; then
              echo "$memory_line"
            fi
          } > perf-observation-measurement.log

          if [ -z "$profile_line" ]; then
            echo "::error::No performance measurement was completed."
            exit 1
          fi

          echo "result=$result" >> "$GITHUB_OUTPUT"
          if [ "$result" = "failed" ]; then
            echo "::warning::The $MEASUREMENT performance measurement failed."
          fi

      - name: Publish perf summary
        if: always()
        env:
          PERF_RESULT: ${{ steps.run_perf.outputs.result }}
          MEASUREMENT: ${{ inputs.measurement }}
        run: |
          profile_line="$(
            grep '^PERF_PROFILE ' perf-observation-measurement.log 2>/dev/null | tail -n1 || true
          )"
          memory_line="$(
            grep '^PERF_MEMORY ' perf-observation-measurement.log 2>/dev/null | tail -n1 || true
          )"

          {
            echo "## JVM Performance Observation"
            if [ "$PERF_RESULT" = "passed" ]; then
              echo "- Result: ✅ Passed"
            else
              echo "- Result: ❌ Failed"
            fi
            echo "- Measurement: $MEASUREMENT"
            echo ""
            if [ -n "$profile_line" ]; then
              echo "### Profile"
              echo '```text'
              echo "$profile_line"
              echo '```'
              append="$(echo "$profile_line" | sed -E 's/.*append_ns_per_op=([0-9.]+).*/\1/')"
              adjacent="$(echo "$profile_line" | sed -E 's/.*adjacent_ns_per_op=([0-9.]+).*/\1/')"
              random_insert="$(echo "$profile_line" | sed -E 's/.*random_insert_ns_per_op=([0-9.]+).*/\1/')"
              edge_move="$(echo "$profile_line" | sed -E 's/.*edge_move_ns_per_op=([0-9.]+).*/\1/')"
              bounded_rebalance="$(echo "$profile_line" | sed -E 's/.*bounded_rebalance_ns_per_key=([0-9.]+).*/\1/')"
              echo ""
              echo "### Absolute Metrics"
              echo "| Metric | Measured | Budget |"
              echo "|---|---:|---:|"
              echo "| append (ns/op) | $append | 160.0 |"
              echo "| adjacent-between (ns/op) | $adjacent | 1850.0 |"
              echo "| random-insert (ns/op) | $random_insert | 220.0 |"
              echo "| edge-to-inner-move (ns/op) | $edge_move | 325.0 |"
              echo "| bounded rebalance (ns/key) | $bounded_rebalance | 2300.0 |"
            else
              echo "- PERF_PROFILE line not found in log."
            fi
            echo ""
            if [ -n "$memory_line" ]; then
              echo "### Memory Observation (non-gating)"
              echo '```text'
              echo "$memory_line"
              echo '```'
              baseline="$(echo "$memory_line" | sed -E 's/.*baseline_used_bytes=([0-9]+).*/\1/')"
              ri_peak="$(echo "$memory_line" | sed -E 's/.*random_insert_peak_bytes=([0-9]+).*/\1/')"
              ri_retained="$(echo "$memory_line" | sed -E 's/.*random_insert_retained_bytes=([0-9]+).*/\1/')"
              move_peak="$(echo "$memory_line" | sed -E 's/.*edge_move_peak_bytes=([0-9]+).*/\1/')"
              move_retained="$(echo "$memory_line" | sed -E 's/.*edge_move_retained_bytes=([0-9]+).*/\1/')"
              echo ""
              echo "| Metric | Used bytes | Delta from baseline |"
              echo "|---|---:|---:|"
              echo "| baseline | $baseline | 0 |"
              echo "| random-insert peak | $ri_peak | $((ri_peak - baseline)) |"
              echo "| random-insert retained | $ri_retained | $((ri_retained - baseline)) |"
              echo "| edge-move peak | $move_peak | $((move_peak - baseline)) |"
              echo "| edge-move retained | $move_retained | $((move_retained - baseline)) |"
            else
              echo "### Memory Observation (non-gating)"
              echo "- PERF_MEMORY line not found in log."
            fi
            echo ""
            echo "<details><summary>Measurement result</summary>"
            echo ""
            echo '```text'
            cat perf-observation-measurement.log || true
            echo '```'
            echo "</details>"
            echo ""
            echo "<details><summary>Log tail</summary>"
            echo ""
            echo '```text'
            tail -n 80 perf-observation.log || true
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload perf artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-observation-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.measurement }}
          path: |
            perf-observation.log
            perf-observation-measurement.log
            library/build/test-results/jvmTest/*.xml
            library/build/reports/tests/jvmTest/**
          if-no-files-found: warn
